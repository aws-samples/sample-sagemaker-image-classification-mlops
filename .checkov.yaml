#
# Checkov configuration for this sample. Each skip is either a design decision
# that needs something a sample cannot ship (a custom domain, a VPC for the
# Lambdas) or a Checkov false positive where the control is implemented.
#
# Run:  checkov --config-file .checkov.yaml

directory:
  - .

skip-path:
  - ".*/\\.terraform/.*"

compact: true
quiet: true

skip-check:
  # ---------------------------------------------------------------------------
  # Deliberate demo-architecture choices (documented in code)
  # ---------------------------------------------------------------------------

  # The CloudFront distribution serves a static page from a private bucket
  # (origin access control); the API it calls has the regional WAF. A
  # CloudFront web ACL must be created in us-east-1 and is billed per ACL.
  - CKV_AWS_68     # CloudFront should have WAF enabled
  - CKV2_AWS_47    # CloudFront WAFv2 WebACL with Log4j AMR

  # Client certificates and a custom certificate need a custom domain name,
  # which a sample cannot provide. (CKV_AWS_174, the TLS policy that also
  # needs one, is skipped inline on the distribution.)
  - CKV2_AWS_51    # API Gateway client-certificate authentication
  - CKV2_AWS_42    # CloudFront custom SSL certificate

  # The Lambdas call public AWS service endpoints; running them in a VPC
  # needs NAT or one interface endpoint per service.
  - CKV_AWS_117    # Lambda configured inside a VPC

  # Training data is uploaded by the user and models are re-trainable; add
  # cross-Region replication for disaster recovery in production.
  - CKV_AWS_144    # S3 cross-region replication

  # Inference responses are per image and must never be served from a cache
  # to another caller.
  - CKV_AWS_120    # API Gateway caching
  - CKV_AWS_225    # API Gateway method-setting caching

  # A static demo page: geo restriction and origin failover add nothing.
  - CKV_AWS_374    # CloudFront geo restriction
  - CKV_AWS_310    # CloudFront origin failover

  # Functions are built from this repository by Terraform in one account;
  # code signing needs an AWS Signer profile per deployment.
  - CKV_AWS_272    # Lambda code-signing validation

  # Only the frontend bucket has no event notifications; nothing consumes them.
  - CKV2_AWS_62    # S3 event notifications

  # ---------------------------------------------------------------------------
  # Documented Checkov false-positives (control IS implemented)
  # ---------------------------------------------------------------------------

  # The WAF association is gated on enable_waf (default true), which Checkov
  # does not resolve through the module.
  - CKV2_AWS_29    # public API gateway protected by WAF

  # X-Ray is on (the lambda module's dynamic tracing_config,
  # enable_xray_tracing = true), but Checkov does not resolve it for the
  # module instances that use count.
  - CKV_AWS_50     # Lambda X-Ray tracing

  # stack-backend-setup uses Terraform Registry modules pinned by version;
  # a commit hash applies to Git sources only.
  - CKV_TF_1       # Terraform module source commit hash
