#
# Applies the training Terraform root. The backend settings (TF_STATE_*) and
# the TF_VAR_* inputs are set on the CodeBuild project by stack-cicd.

version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.15.6"
    HASHICORP_KEY_FINGERPRINT: "C874011F0AB405110D02105534365D9472D7468F" # pragma: allowlist secret - HashiCorp public PGP key fingerprint

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - dnf update -y python3-pip libtasn1 libxml2 || true
      - curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
      - curl -fsSLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS.sig"
      # The checksum file is trusted only once its signature verifies against
      # HashiCorp's release key, identified by its pinned fingerprint.
      - curl -fsSL https://www.hashicorp.com/.well-known/pgp-key.txt -o hashicorp.asc
      - export GNUPGHOME="$(mktemp -d)"
      - gpg --batch --quiet --import hashicorp.asc
      - gpg --batch --with-colons --fingerprint | grep -q "^fpr:::::::::${HASHICORP_KEY_FINGERPRINT}:$"
      - gpg --batch --verify "terraform_${TERRAFORM_VERSION}_SHA256SUMS.sig" "terraform_${TERRAFORM_VERSION}_SHA256SUMS"
      - grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip$" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum -c -
      - unzip -o "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" terraform -d /usr/local/bin/
      - rm -rf "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" "terraform_${TERRAFORM_VERSION}_SHA256SUMS.sig" hashicorp.asc "$GNUPGHOME"
      - terraform --version

  pre_build:
    commands:
      - echo "Initializing Terraform for training infrastructure"
      - cd "$CODEBUILD_SRC_DIR/stack-training"
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${TF_STATE_REGION}" -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ID}"

  build:
    commands:
      - echo "Planning and applying SageMaker training infrastructure"
      - cd "$CODEBUILD_SRC_DIR/stack-training"
      - terraform plan -input=false -out=tfplan
      - terraform apply -input=false tfplan

  post_build:
    commands:
      - echo "Infrastructure deployment completed"

artifacts:
  files:
    - "**/*"
